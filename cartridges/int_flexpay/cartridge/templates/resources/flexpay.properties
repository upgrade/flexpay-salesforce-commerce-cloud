# FlexPay API error messages (displayed on checkout page)
# From https://docs.uplift.com/apidocs/creates-an-order
error.flexpay.INVALID_AIR_RESERVATION=The flight reservation details are invalid. Please review your booking information.
error.flexpay.INVALID_BILLING_CONTACT=The billing contact information is not valid. Please check your billing details.
error.flexpay.INVALID_COUNTRY=This payment method is not available in your country.
error.flexpay.INVALID_CURRENCY=This currency is not supported for this payment method.
error.flexpay.INVALID_LOCALE=The selected language or region is not supported for this payment method.
error.flexpay.MAX_BOOKING_WINDOW=The booking date is too far in the future for this payment plan.
error.flexpay.MAX_PRICE=The order amount exceeds the maximum allowed for this payment plan.
error.flexpay.MIN_BOOKING_WINDOW=The booking date is too soon for this payment plan.
error.flexpay.MIN_PRICE=The order amount is below the minimum required for this payment plan.
error.flexpay.MISSING_PRODUCT=Product information is missing from the order. Please try again.
error.flexpay.MISSING_TRAVEL_RESERVATION=Travel reservation details are required for this payment plan.
error.flexpay.NO_OFFERS=No payment plans are available for this order. Please try a different payment method.
error.flexpay.LOAN_NOT_ACCEPTED=The payment plan application was not approved. Please try a different payment method.
error.flexpay.UNKNOWN=Something went wrong while processing your payment. Please try again or choose a different payment method.